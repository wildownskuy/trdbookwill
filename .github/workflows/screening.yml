name: Screening Sesi 1

on:
  schedule:
    # Senin - Kamis: 12:00 WIB (05:00 UTC)
    - cron: '0 5 * * 1-4'
    # Jumat: 11:30 WIB (04:30 UTC)
    - cron: '30 4 * * 5'
  workflow_dispatch:
    inputs:
      job_date:
        required: false
        default: ''
        description: 'Tanggal trading (YYYY-MM-DD), kosongkan untuk hari ini'
jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: screening-group
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Screening
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.job_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.job_date }}"
          fi
          python scripts/screening.py $DATE_ARG