name: Check-Gap Sesi 2

on:
  schedule:
    # Senin - Kamis: 13:35 WIB (06:35 UTC)
    - cron: '35 6 * * 1-4'
    # Jumat: 14:05 WIB (07:05 UTC)
    - cron: '5 7 * * 5'
  workflow_dispatch:
    inputs:
      job_date:
        required: false
        default: ''
        description: 'Tanggal trading (YYYY-MM-DD), kosongkan untuk hari ini'
jobs:
  check-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: check-gap-group
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Check-Gap
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.job_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.job_date }}"
          fi
          python scripts/check_gap.py $DATE_ARG