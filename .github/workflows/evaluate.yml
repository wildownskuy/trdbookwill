name: Evaluate Sesi 2

on:
  schedule:
    # Senin - Jumat: 15:50 WIB (08:50 UTC)
    - cron: '50 8 * * 1-5'
  workflow_dispatch:
    inputs:
      job_date:
        required: false
        default: ''
        description: 'Tanggal trading (YYYY-MM-DD), kosongkan untuk hari ini'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: evaluate-group
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Evaluate
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.job_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.job_date }}"
          fi
          python scripts/evaluate.py $DATE_ARG